# Nightly bots (specs/10 section 6.2, specs/00 decision 59): a thin wrapper around `./check.sh --nightly`. The Linux
# leg runs the bot sweep (CSV), the longest-walls report and `golden --replay`; the Windows and macOS (ARM64) legs run
# only `golden --replay` (`--nightly --replay-only`), the cross-platform determinism check.
#
# Not here yet: upload of the sweep CSV to the metrics bucket and the longest-walls diff against the previous night
# posted to the team channel (both need a deploy target / secrets); the CSV and report are run artifacts meanwhile.
name: nightly-bots

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  nightly:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --nightly
          - os: windows-latest
            args: --nightly --replay-only
          - os: macos-14
            args: --nightly --replay-only
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: ./check.sh ${{ matrix.args }}
        run: ./check.sh ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-bots-${{ matrix.os }}
          path: build/check/
          if-no-files-found: ignore
          retention-days: 30
